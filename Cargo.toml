[package]
name = "tonism"
version = "0.1.0"
edition = "2024"
default-run = "tonism"

[[bin]]
name = "tonism"
path = "src/main.rs"

[[bin]]
name = "check-buffer"
path = "scripts/check_buffer_size.rs"

# Phase A walking skeleton for the cpal-direct standalone pivot.  Falsifier
# binary for ADR-005 — runs only on the user's dev machine for the 5-min
# clean-audio session, never shipped.  See docs/specs/cpal-direct-standalone/
# spec.md.  Will be retired (or repurposed as a phase-B/C scratch pad) once
# Phase A's exit criterion is met.
[[bin]]
name = "feedback"
path = "src/bin/feedback.rs"

# Opt-in profiling features.  See README.md "Profiling" for the recommended
# invocations.  Keep these OFF in release builds — the assertion has overhead.
[features]
# Panics on any heap allocation reached from the audio callback.  Enforces A2
# (architecture standard) and J1 (zero allocations per buffer).  Use during
# development with `cargo run --features debug-assert-no-alloc`.
debug-assert-no-alloc = ["nih_plug/assert_process_allocs"]

[dependencies]
nih_plug = { git = "https://github.com/BillyDM/nih-plug", features = ["standalone"] }
nih_plug_egui = { git = "https://github.com/BillyDM/nih-plug" }
egui = { version = "0.34.1", default-features = false, features = ["default_fonts"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"
# rtrb is already a transitive dep via nih-plug; pinned here so the audio
# log bridge can reference it directly without going through nih-plug internals.
rtrb = "0.3"
cpal = "0.17.3"

# Patch: temporarily route nih_plug and nih_plug_egui through our fork to pick
# up the macOS/Windows vst3 import fix. Drop this once
# https://github.com/BillyDM/nih-plug/pull/<TBD> is merged.
# See ADR-002 / ADR-003 for context.
[patch."https://github.com/BillyDM/nih-plug"]
nih_plug = { git = "https://github.com/Z3U2/nih-plug", branch = "fix-macos-windows-vst3-import" }
nih_plug_egui = { git = "https://github.com/Z3U2/nih-plug", branch = "fix-macos-windows-vst3-import" }
