[package]
name = "tonism"
version = "0.1.0"
edition = "2024"
default-run = "tonism"

[[bin]]
name = "tonism"
path = "src/main.rs"

[[bin]]
name = "check-buffer"
path = "scripts/check_buffer_size.rs"

# Phase A walking skeleton for the cpal-direct standalone pivot.  Falsifier
# binary for ADR-005 — runs only on the user's dev machine for the 5-min
# clean-audio session, never shipped.  See docs/specs/cpal-direct-standalone/
# spec.md.  Will be retired (or repurposed as a phase-B/C scratch pad) once
# Phase A's exit criterion is met.
[[bin]]
name = "feedback"
path = "src/bin/feedback.rs"

# Opt-in features. See README.md "Profiling" for the recommended invocations.
[features]
# C10 (see docs/adr/005-standalone-audio-cpal-direct.md): gates the dormant
# nih-plug Plugin impl + nih_plug_egui GUI adapter. When OFF (default), the
# standalone binary runs the cpal-direct path (src/cpal_direct.rs) with an
# eframe GUI window (Phase D+); src/audio/{params,plugin}.rs and
# src/gui/editor.rs are excluded from the build. Enable with --features
# plugin-export to compile the v0.2+ VST3/CLAP-ready surface. CI runs both
# configurations so the dormant impl does not silently drift.
plugin-export = [
    "dep:nih_plug",
    "dep:nih_plug_egui",
]

# Panics on any heap allocation reached from the audio callback. Enforces
# A2 (architecture standard) and J1 (zero allocations per buffer). Use
# during development with `cargo run --features debug-assert-no-alloc`.
# Keep OFF in release builds — the assertion has overhead.
#
# The `nih_plug?/assert_process_allocs` entry is conditional: it activates
# the corresponding nih-plug feature only when nih-plug is itself in the
# dep graph (i.e. when `plugin-export` is also enabled). When `plugin-export`
# is off, only `assert_no_alloc` wraps the cpal callback.
debug-assert-no-alloc = [
    "dep:assert_no_alloc",
    "nih_plug?/assert_process_allocs",
]

[dependencies]
# Always-on (cpal-direct standalone path).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"
# rtrb is also a transitive dep via nih-plug when plugin-export is on;
# pinned here so the audio log bridge + cpal-direct ring can reference it
# directly without going through nih-plug internals.
rtrb = "0.3"
cpal = "0.17.3"
serde = { version = "1", features = ["derive"] }
confy = "0.6"

# Optional: enabled by `debug-assert-no-alloc` only.
#
# `default-features = false` opts out of the upstream `disable_release`
# default feature, which would compile `AllocDisabler` out in release
# builds and turn the whole guard into a no-op. We want the guard to
# fire on EVERY build that has `debug-assert-no-alloc` enabled — dev or
# release — so the alloc check is meaningful when iterating on the
# audio path with `--release` (the usual mode for realtime audio dev,
# since debug builds are too slow to keep up with cpal callbacks).
assert_no_alloc = { version = "1", default-features = false, optional = true }

# Always-on: egui + eframe for the cpal-direct standalone GUI (Phase D+).
# egui is also used transitively by nih_plug_egui when plugin-export is on;
# Cargo unifies both to the same 0.34.x version.
egui = { version = "0.34.1", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }

# Optional: enabled by `plugin-export` only. The v0.2+ VST3/CLAP-ready
# surface — kept dormant by default per ADR-005.
nih_plug = { git = "https://github.com/BillyDM/nih-plug", features = ["standalone"], optional = true }
nih_plug_egui = { git = "https://github.com/BillyDM/nih-plug", optional = true }

# Patch: temporarily route nih_plug and nih_plug_egui through our fork to pick
# up the macOS/Windows vst3 import fix. Drop this once
# https://github.com/BillyDM/nih-plug/pull/<TBD> is merged.
# See ADR-002 / ADR-003 for context.
[patch."https://github.com/BillyDM/nih-plug"]
nih_plug = { git = "https://github.com/Z3U2/nih-plug", branch = "fix-macos-windows-vst3-import" }
nih_plug_egui = { git = "https://github.com/Z3U2/nih-plug", branch = "fix-macos-windows-vst3-import" }

[dev-dependencies]
serde_json = "1"
